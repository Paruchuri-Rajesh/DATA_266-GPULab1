# Task 3 — CycleGAN v3: warm start from v2's best checkpoint (v1 = config.yaml, v2 = config_v2.yaml)
# v2 (DiffAugment color+translation+cutout, lambda_identity 2.5, 50 epochs) reached held-out FID 95.8 at epoch 45
# (all 7,038 photos: FID 92.30, score 46.35). Its FID fell only once the LR decayed (122.6 at epoch 20 -> 95.8),
# and blob artifacts appeared while colour augmentation was on. v3 continues from v2's best weights with:
#   - a second LR cycle: 1e-4 for 2 epochs, then linear decay to 0 over 10 (12K steps; Colab GPU quota was used up,
#     so it runs on the Apple M5 at ~0.87 s/step, ~3 h)
#   - translation-only DiffAugment: D sees true colours again, so it can judge the Monet palette
# Same data split (seed 1337, 1,000 held-out photos never trained on), architecture and loss weights as v2.
data:
  domain_a_dir: "../data/photo_jpg"
  domain_b_dir: "../data/monet_jpg"
  image_size: 256
  holdout_a: 1000
  holdout_b: 0
  seed: 1337

model:
  ngf: 64
  ndf: 64
  n_resblocks: 9
  upsample: "resize_conv"

train:
  init_from: "checkpoints/v2/{name}.pt"   # v2's best epoch (all four networks)
  batch_size: 1
  epochs: 12
  decay_start_epoch: 2
  lr: 1.0e-4
  beta1: 0.5
  lambda_cycle: 10.0
  lambda_identity: 2.5
  pool_size: 50
  diffaugment: "translation"
  max_steps_per_epoch: 1000
  amp: true
  num_workers: 4
  log_every: 100
  sample_every: 1000
  device: "auto"
  out_dir: "checkpoints/v3"
  log_file: "logs/train_raw_v3.log"

select:
  enabled: true
  from_epoch: 1
  every: 2                # epochs 1, 3, ..., 11 scored on the held-out photos; best kept as G_AB.pt
  n_images: 1000
  stats: "../data/competition_files/real_stats.npz"

eval:
  max_images: null
  batch_size: 16
  pred_dir: "outputs/v3"
